apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pipeline-backend
  namespace: pipeline-test
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/api/pipeline`) || PathPrefix(`/demo`)
      kind: Rule
      priority: 20
      services:
        - name: apiservice
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pipeline-frontend
  namespace: pipeline-test
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: webfrontend
          port: 80
          sticky:
            cookie:
              name: pipeline_frontend
              httpOnly: true
              secure: false
              sameSite: lax
